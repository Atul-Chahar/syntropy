<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const F = {"roti": ["Roti", "pc", "1 medium \u00b7 40 g", 105, 3, 18, 2.5, 1], "dal": ["Dal tadka", "katori", "1 katori \u00b7 150 g", 170, 9, 22, 5, 0.5], "rice": ["Jeera rice", "katori", "1 katori \u00b7 150 g", 210, 4, 42, 3, 0.5], "palak": ["Palak paneer", "katori", "1 katori \u00b7 150 g", 250, 12, 9, 18, 0.5], "dahi": ["Dahi", "katori", "1 katori \u00b7 150 g", 95, 5, 7, 5, 0.5]};
    const base = { roti: 2, dal: 1, rice: 1, palak: 1, dahi: 1 };
    const conf = { roti: 94, dal: 91, rice: 84, palak: 86, dahi: 89 };
    const dots = { roti: '#E2B06A', dal: '#F2BE55', rice: '#F3F1EC', palak: '#8DAF5C', dahi: '#CFE3F2' };
    const q = (this.state && this.state.q) || base;
    const set = (k, v) => this.setState({ q: Object.assign({}, q, { [k]: Math.max(0, Math.min(12, v)) }) });
    const fmt = (k, n) => F[k][1] === 'pc' ? n + ' pc' : (n === 1 ? '1 katori' : n + ' katori');
    let T = 0, P = 0, C = 0, Fa = 0;
    const items = Object.keys(base).map((k) => {
      const f = F[k], n = q[k], st = f[7];
      T += f[3] * n; P += f[4] * n; C += f[5] * n; Fa += f[6] * n;
      const extra = n - base[k];
      return {
        name: f[0], dot: dots[k], qty: fmt(k, n), kcal: Math.round(f[3] * n), conf: conf[k] + '% match',
        added: extra > 0, addedLabel: '+' + extra + ' added',
        minus: () => set(k, n - st), plus: () => set(k, n + st),
        minusLabel: 'Less ' + f[0], plusLabel: 'More ' + f[0]
      };
    });
    const quick = [['roti', '1 roti', 1], ['dahi', '1 katori dahi', 1], ['rice', '½ rice', 0.5]].map((x) => ({
      label: x[1], add: () => set(x[0], q[x[0]] + x[2])
    }));
    const pk = P * 4, ck = C * 4, fk = Fa * 9, sum = Math.max(1, pk + ck + fk);
    const pct = (v) => 'calc(' + (v / sum * 100).toFixed(1) + '% - 3px)';
    return { items, quick, total: Math.round(T).toLocaleString('en-IN'), p: Math.round(P), c: Math.round(C), f: Math.round(Fa), pw: pct(pk), cw: pct(ck), fw: pct(fk) };
  }
}
</script>
