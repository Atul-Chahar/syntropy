<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&amp;family=Geist:wght@200..700&amp;family=Geist+Mono:wght@400..500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F0D}
.sy{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;color:#F3F1EC}
.dot{font-family:'Doto','Geist Mono',ui-monospace,monospace;font-weight:800;font-variant-numeric:tabular-nums}

input{font:inherit;color:inherit}
.field::placeholder{color:#F3F1EC;opacity:1}

@keyframes sy-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sy-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

</style>
</helmet>
<div class="sy" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0F0D"><div aria-hidden="true" style="position: absolute; right: -240px; top: -120px; width: 540px; height: 540px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at center, rgba(255,107,61,0.3) 0%, rgba(255,107,61,0.10) 38%, rgba(255,107,61,0) 70%)"></div><div aria-hidden="true" style="position: absolute; left: -260px; bottom: -220px; width: 520px; height: 520px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at center, rgba(137,170,124,0.3) 0%, rgba(137,170,124,0.10) 38%, rgba(137,170,124,0) 70%)"></div><div style="position: absolute; left: 0; right: 0; top: 0; padding: 60px 20px 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 14px">
<header style="display: flex; justify-content: space-between; align-items: center">
<a href="FoodLog.dc.html" aria-label="Close" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; color: #F3F1EC; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.085); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 48px -24px rgba(0,0,0,0.6) "><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
<h1 style="margin: 0; font-size: 17px; font-weight: 500; letter-spacing: -0.02em">Add to lunch</h1>
<a href="Scan.dc.html" aria-label="Scan instead" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.085); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 48px -24px rgba(0,0,0,0.6)"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M4 8.5A2 2 0 0 1 6 6.5h2l1.5-2h5l1.5 2h2a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"></path><circle cx="12" cy="12.5" r="3.5"></circle></svg></a>
</header>
<label style="display: flex; align-items: center; gap: 10px; min-height: 58px; padding: 0 8px 0 16px; border-radius: 22px; box-sizing: border-box; background: rgba(255,199,176,0.06); border: 1px solid rgba(255,199,176,0.25)">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; color: #FFC7B0"><path d="M12 3c.7 5 3.9 8.3 9 9-5.1.7-8.3 3.9-9 9-.7-5.1-3.9-8.3-9-9 5.1-.7 8.3-4 9-9z"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Describe what you ate</span>
<input type="text" placeholder="“2 more roti and a katori of dahi”" style="flex-grow: 1; min-width: 0; height: 44px; border: 0; outline: none; background: transparent; font-size: 14.5px; color: #F3F1EC">
<button type="button" aria-label="Speak instead" style="width: 42px; height: 42px; border-radius: 21px; padding: 0; border: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.08)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><rect x="9" y="3.5" width="6" height="11" rx="3"></rect><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v2.5"></path></svg></button>
</label>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 0 -20px; padding: 0 20px; scrollbar-width: none"><span style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; background: #F3F1EC; color: #0B0F0D; font-weight: 500">Frequent</span><span style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); color: rgba(243,241,236,0.75)">Indian</span><span style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); color: rgba(243,241,236,0.75)">Recent</span><span style="height: 36px; padding: 0 14px; border-radius: 18px; display: flex; align-items: center; font-size: 13px; white-space: nowrap; border: 1px solid rgba(255,255,255,0.1); color: rgba(243,241,236,0.75)">My foods</span></div>
<div style="display: flex; flex-direction: column; gap: 6px"><sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<div style="display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; height: 60px; padding: 0 8px 0 16px; border-radius: 20px; background: {{it.bg}}; border: 1px solid {{it.bd}}">
<div style="display: flex; flex-direction: column; gap: 3px; min-width: 0"><span style="font-size: 15px">{{it.name}}</span><span class="mono" style="font-size: 11px; color: rgba(243,241,236,0.55)">{{it.unit}} · {{it.kcal}} kcal</span></div>
<div style="display: flex; align-items: center; gap: 2px">
<button type="button" onClick="{{it.minus}}" aria-label="{{it.minusLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; opacity: {{it.minOp}}"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M5 12h14"></path></svg></button>
<span class="dot" style="min-width: 26px; text-align: center; font-size: 20px">{{it.n}}</span>
<button type="button" onClick="{{it.plus}}" aria-label="{{it.plusLabel}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; padding: 0; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
</div>
</sc-for></div>
</div>
<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 220px; background: linear-gradient(180deg, rgba(11,15,13,0) 0%, rgba(11,15,13,0.9) 45%, #0B0F0D 100%); pointer-events: none"></div>
<div style="position: absolute; left: 16px; right: 16px; bottom: 26px; display: flex; align-items: center; gap: 10px; padding: 10px 10px 10px 20px; border-radius: 36px; background: rgba(14,18,16,0.58); border: 1px solid rgba(255,255,255,0.09); backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 20px 40px rgba(0,0,0,0.45)">
<div style="display: flex; flex-direction: column; gap: 2px; flex-grow: 1"><span style="font-size: 13px; color: rgba(243,241,236,0.66)">{{count}}</span><span style="display: flex; align-items: baseline; gap: 4px"><span class="dot" style="font-size: 26px; line-height: 1">{{kcal}}</span><span style="font-size: 12px; color: rgba(243,241,236,0.6)">kcal</span></span></div>
<a href="FoodLog.dc.html" style="height: 52px; padding: 0 22px; border-radius: 26px; display: flex; align-items: center; gap: 8px; background: #F3F1EC; color: #0B0F0D; font-size: 15px; font-weight: 500"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>Add to lunch</a>
</div><svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none"><filter id="gr-qa"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gr-qa)"></rect></svg></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const Q = [["roti", "Roti", "1 medium \u00b7 40 g", 105], ["dahi", "Dahi", "1 katori \u00b7 150 g", 95], ["dal", "Dal tadka", "1 katori \u00b7 150 g", 170], ["rice", "Jeera rice", "1 katori \u00b7 150 g", 210], ["chai", "Masala chai", "1 cup \u00b7 150 ml", 80], ["idli", "Idli", "1 pc \u00b7 40 g", 58], ["dosa", "Plain dosa", "1 pc \u00b7 80 g", 170], ["rajma", "Rajma", "1 katori \u00b7 150 g", 190]];
    const c = (this.state && this.state.c) || { roti: 2, dahi: 1 };
    const set = (k, v) => this.setState({ c: Object.assign({}, c, { [k]: Math.max(0, Math.min(9, v)) }) });
    let kcal = 0, kinds = 0, pieces = 0;
    const items = Q.map((q) => {
      const n = c[q[0]] || 0;
      kcal += n * q[3]; if (n) { kinds++; pieces += n; }
      return {
        name: q[1], unit: q[2], kcal: q[3], n: String(n), minOp: n ? '1' : '0.35',
        bg: n ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.03)', bd: n ? 'rgba(255,199,176,0.3)' : 'rgba(255,255,255,0.07)',
        minus: () => set(q[0], n - 1), plus: () => set(q[0], n + 1),
        minusLabel: 'One less ' + q[1], plusLabel: 'One more ' + q[1]
      };
    });
    return { items, kcal: kcal.toLocaleString('en-IN'), count: kinds ? (kinds + (kinds === 1 ? ' food · ' : ' foods · ') + pieces + ' portions') : 'Nothing selected' };
  }
}
</script>
</body>
</html>
