<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Syntropy · Sign in</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin=""><link href="https://fonts.googleapis.com/css2?family=Doto:wght@400..900&amp;family=Geist:wght@200..700&amp;family=Geist+Mono:wght@400..500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0F0D}
.sy{font-family:'Geist',ui-sans-serif,system-ui,-apple-system,'Helvetica Neue',sans-serif;-webkit-font-smoothing:antialiased;color:#F3F1EC}
.dot{font-family:'Doto','Geist Mono',ui-monospace,monospace;font-weight:800;font-variant-numeric:tabular-nums}
.mono{font-family:'Geist Mono',ui-monospace,SFMono-Regular,monospace}
a{color:inherit;text-decoration:none}a:hover{color:#FFC7B0}
button{font:inherit;color:inherit;cursor:pointer;margin:0}
input{font:inherit;color:inherit}
.field::placeholder{color:#F3F1EC;opacity:1}
@keyframes sy-scan{0%{transform:translateY(0)}50%{transform:translateY(270px)}100%{transform:translateY(0)}}
@keyframes sy-pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes sy-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes sy-ring{0%{transform:scale(.72);opacity:.55}100%{transform:scale(1.35);opacity:0}}
@keyframes sy-spin{to{transform:rotate(360deg)}}
@keyframes sy-pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes sy-scanline{0%,100%{transform:translateY(-26px)}50%{transform:translateY(26px)}}
.ring{position:absolute;left:0;top:0;width:220px;height:220px;border-radius:50%;border:1px solid rgba(255,199,176,.5);animation:sy-ring 3s cubic-bezier(.2,.7,.2,1) infinite}
.spin{animation:sy-spin 1.1s linear infinite;transform-origin:50% 50%}
.pop{animation:sy-pop .6s cubic-bezier(.2,.7,.2,1) both}
.scanline{animation:sy-scanline 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.ring,.spin,.pop,.scanline{animation:none!important}}
</style>
</helmet>
<div class="sy" style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #0B0F0D"><div aria-hidden="true" style="position: absolute; left: -240px; bottom: -160px; width: 560px; height: 560px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at center, rgba(137,170,124,0.46) 0%, rgba(137,170,124,0.16) 38%, rgba(137,170,124,0) 70%)"></div><div aria-hidden="true" style="position: absolute; right: -240px; bottom: -200px; width: 540px; height: 540px; border-radius: 50%; pointer-events: none; background: radial-gradient(circle at center, rgba(255,107,61,0.42) 0%, rgba(255,107,61,0.15) 38%, rgba(255,107,61,0) 70%)"></div><div style="position: absolute; left: 20px; right: 20px; top: 60px; display: flex; justify-content: space-between; align-items: center"><a href="Welcome.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 22px; display: flex; align-items: center; justify-content: center; padding: 0; color: #F3F1EC; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.085); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 48px -24px rgba(0,0,0,0.6) "><svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M15 5l-7 7 7 7"></path></svg></a><span class="mono" style="font-size: 11px; letter-spacing: 0.06em; color: rgba(243,241,236,0.55)">SIGN IN</span></div>
<div style="position: absolute; left: 0; right: 0; top: 150px; display: flex; justify-content: center"><div aria-hidden="true" style="position: relative; width: 220px; height: 220px">
<span class="ring"></span><span class="ring" style="animation-delay: 1s"></span><span class="ring" style="animation-delay: 2s"></span>
<div style="position: absolute; left: 20px; top: 20px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, {{glow}}, rgba(0,0,0,0) 70%)"></div>
<sc-if value="{{verifying}}" hint-placeholder-val="{{false}}">
<svg class="spin" width="176" height="176" viewBox="0 0 176 176" style="position: absolute; left: 22px; top: 22px"><defs><linearGradient id="si-sp" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFC7B0"></stop><stop offset="1" stop-color="#FF6B3D" stop-opacity="0"></stop></linearGradient></defs><circle cx="88" cy="88" r="84" fill="none" stroke="url(#si-sp)" stroke-width="3" stroke-linecap="round" stroke-dasharray="300 600"></circle></svg>
</sc-if>
<div style="position: absolute; left: 50px; top: 50px; width: 120px; height: 120px; border-radius: 60px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: {{coreBg}}; color: {{coreFg}}; border: 1px solid rgba(255,255,255,0.16); box-shadow: inset 0 1px 0 rgba(255,255,255,0.2), 0 30px 60px rgba(0,0,0,0.45); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px)">
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}"><svg aria-hidden="true" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"></path></svg></sc-if>
<sc-if value="{{verifying}}" hint-placeholder-val="{{false}}"><span style="position: relative; display: flex"><svg aria-hidden="true" width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M7 17c1-2 1.4-4 1.4-6a3.6 3.6 0 0 1 7.2 0c0 2.6-.4 4.8-1.3 7"></path><path d="M12 11c0 3-.6 5.6-1.8 8"></path><path d="M4.5 13.5c.4-1 .5-1.8.5-3a7 7 0 0 1 13.8-1.6"></path><path d="M19.2 12c0 2.4-.3 4.3-.9 6"></path><path d="M6.5 5.2A8.8 8.8 0 0 1 17.5 5"></path></svg><span class="scanline" style="position: absolute; left: -10px; right: -10px; top: 22px; height: 2px; border-radius: 1px; background: #FFC7B0; box-shadow: 0 0 12px 3px rgba(255,160,120,0.6)"></span></span></sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}"><span class="pop" style="display: flex"><svg aria-hidden="true" width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
</div>
</div></div>
<div style="position: absolute; left: 28px; right: 28px; top: 408px; display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<h1 style="margin: 0; font-size: 36px; line-height: 1.05; font-weight: 300; letter-spacing: -0.045em">{{title}}</h1>
<p style="margin: 0; font-size: 15px; line-height: 1.5; color: rgba(243,241,236,0.68); max-width: 300px">{{sub}}</p>
</div>
<div style="position: absolute; left: 24px; right: 24px; bottom: 30px; display: flex; flex-direction: column; gap: 12px">
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<button type="button" onClick="{{start}}" style="width: 100%; height: 58px; border-radius: 29px; border: 0; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 16px; font-weight: 500; background: #F3F1EC; color: #0B0F0D; box-shadow: 0 16px 40px rgba(0,0,0,0.35)"><svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><circle cx="8" cy="15" r="4"></circle><path d="M11 12l8-8M16 7l2.5 2.5M14 9l2 2"></path></svg>Sign in with passkey</button>
</sc-if>
<sc-if value="{{verifying}}" hint-placeholder-val="{{false}}">
<div role="status" style="height: 58px; border-radius: 29px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; color: rgba(243,241,236,0.8); background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.085); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 48px -24px rgba(0,0,0,0.6)"><span style="width: 8px; height: 8px; border-radius: 4px; background: #FFC7B0; animation: sy-pulse 1s ease-in-out infinite"></span>Waiting for Face ID, fingerprint or screen lock</div>
</sc-if>
<sc-if value="{{done}}" hint-placeholder-val="{{false}}">
<a href="Home.dc.html" class="pop" style="height: 58px; border-radius: 29px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; font-weight: 500; background: #F3F1EC; color: #0B0F0D; box-shadow: 0 16px 40px rgba(0,0,0,0.35)">Continue<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0; "><path d="M9 6l6 6-6 6"></path></svg></a>
</sc-if>
<sc-if value="{{idle}}" hint-placeholder-val="{{true}}">
<button type="button" style="width: 100%; height: 54px; border-radius: 27px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 15px; background: rgba(255,255,255,0.045); border: 1px solid rgba(255,255,255,0.085); backdrop-filter: blur(22px) saturate(140%); -webkit-backdrop-filter: blur(22px) saturate(140%); box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 24px 48px -24px rgba(0,0,0,0.6)"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1.2"></rect><rect x="14" y="4" width="6" height="6" rx="1.2"></rect><rect x="4" y="14" width="6" height="6" rx="1.2"></rect><path d="M14 14h2v2h-2zM18 14h2M14 18h2M18 18h2v2"></path></svg>Use a passkey from another device</button>
<div style="display: flex; justify-content: space-between; padding: 6px 6px 0; font-size: 13.5px; color: rgba(243,241,236,0.62)">
<button type="button" style="border: 0; padding: 0; min-height: 44px; background: transparent; font-size: 13.5px; color: rgba(243,241,236,0.72)">Email me a sign-in link</button>
<a href="SignUp.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #F3F1EC">Create account</a>
</div>
</sc-if>
</div><svg aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; opacity: 0.07; mix-blend-mode: overlay; pointer-events: none"><filter id="gr-si"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"></feTurbulence><feColorMatrix type="saturate" values="0"></feColorMatrix></filter><rect width="100%" height="100%" filter="url(#gr-si)"></rect></svg></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  componentDidUpdate() { this.arm(); }
  componentDidMount() { this.arm(); }
  componentWillUnmount() { if (this._t) clearTimeout(this._t); }
  arm() {
    if (this.state && this.state.s === 'verify' && !this._t) {
      this._t = setTimeout(() => { this._t = null; this.setState({ s: 'done' }); }, 1700);
    }
  }
  orb(s) {
    return {
      idle: s === 'idle', verifying: s === 'verify', done: s === 'done',
      glow: s === 'done' ? 'rgba(169,195,160,0.45)' : 'rgba(255,107,61,0.35)',
      coreBg: s === 'done' ? 'radial-gradient(circle at 35% 25%, #DDEBD4, #A9C3A0 60%, #6F8F63)' : 'radial-gradient(circle at 35% 25%, rgba(255,255,255,0.18), rgba(30,36,33,0.7) 65%)',
      coreFg: s === 'done' ? '#0B0F0D' : '#F3F1EC'
    };
  }
  renderVals() {
    const s = (this.state && this.state.s) || 'idle';
    const T = {
      idle: ['Welcome back', 'Use the passkey saved on this phone. No password, no codes.'],
      verify: ['Confirming it is you', 'Look at your phone or touch the sensor.'],
      done: ['Signed in', 'Good to see you, Atul. Your data is ready.']
    };
    return Object.assign(this.orb(s), { title: T[s][0], sub: T[s][1], start: () => this.setState({ s: 'verify' }) });
  }
}
</script>
</body>
</html>
