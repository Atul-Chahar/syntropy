<script type="text/x-dc" data-dc-script data-props='{"$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = [
      { set: 'W', prev: 'BW × 10', kg: 'BW', reps: '8', rpe: '\u2013' },
      { set: '1', prev: '+10 × 8', kg: '+10', reps: '8', rpe: '7' },
      { set: '2', prev: '+12.5 × 7', kg: '+12.5', reps: '7', rpe: '8' },
      { set: '3', prev: '+12.5 × 6', kg: '12.5', reps: '8', rpe: '8' },
      { set: '4', prev: '+10 × 8', kg: '+10', reps: '8', rpe: '\u2013' }
    ];
    const done = (this.state && this.state.done) || [true, true, true, false, false];
    const activeIdx = done.indexOf(false);
    const rows = base.map((b, i) => {
      const d = done[i], a = i === activeIdx;
      return Object.assign({}, b, {
        active: a, inactive: !a,
        bg: a ? 'rgba(255,255,255,0.07)' : 'transparent',
        bd: a ? 'rgba(255,199,176,0.28)' : 'transparent',
        fg: d ? 'rgba(243,241,236,0.92)' : 'rgba(243,241,236,0.4)',
        setColor: b.set === 'W' ? '#FFC7B0' : 'rgba(243,241,236,0.7)',
        ckBg: d ? '#A9C3A0' : 'transparent', ckFg: d ? '#0B0F0D' : 'rgba(243,241,236,0.5)',
        ckBd: d ? '#A9C3A0' : 'rgba(255,255,255,0.14)',
        pressed: d ? 'true' : 'false', label: 'Mark set ' + b.set + (d ? ' not done' : ' done'),
        toggle: () => { const n = done.slice(); n[i] = !n[i]; this.setState({ done: n }); }
      });
    });
    return { rows };
  }
}
